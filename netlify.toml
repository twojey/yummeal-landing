# Silo /comparatif retire au profit de /alternatives. Ses 23 pages profondes
# ciblaient « Yummeal vs X », un mot-cle qui contient notre marque alors
# qu'elle n'a pas de notoriete de recherche : personne ne le tape. Chaque
# ancienne URL a une cible qui traite le meme sujet, donc rien n'est perdu.
# yummeal-vs-olio et yummeal-vs-toogoodtogo renvoient vers l'index : ce ne sont
# pas des concurrents fonctionnels, aucune page de comparaison ne leur
# correspond.
[[redirects]]
  from = "/comparatif/yummeal-vs-jow/*"
  to = "/alternatives/jow/"
