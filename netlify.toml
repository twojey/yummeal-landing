# Consolidations du 12/09/2026 (lot D.3 du plan). Dans chaque paire, la page la
# plus riche survit et a absorbe le contenu de l'autre — verifie mot par mot
# avant suppression, et le contenu qui n'etait couvert nulle part ailleurs
# (chapelure, croutons) a ete transfere. Rien n'est perdu.
[[redirects]]
  from = "/ingredients/epicerie-feculents/pain-rassis/*"
  to = "/urgencies/que-faire-avec-pain-rassis/"
  status = 301

[[redirects]]
  from = "/ingredients/epicerie-feculents/restes-riz-veille/*"
  to = "/ingredients/epicerie-feculents/riz-restes/"
  status = 301

[[redirects]]
  from = "/ingredients/viandes-poissons/restes-poulet-roti/*"
  to = "/ingredients/viandes-poissons/poulet-restes/"
  status = 301

[[redirects]]
  from = "/ingredients/legumes/oignons-conservation/*"
  to = "/anti-gaspillage/comment-conserver-oignons-coupes/"
  status = 301

# Silo /scenarios dissous : son index faisait 85 mots pour un seul enfant, qui
# a rejoint /solutions ou il a sa place.
[[redirects]]
  from = "/scenarios/mamans-actives/*"
  to = "/solutions/mamans-actives-charge-mentale/"
  status = 301

[[redirects]]
  from = "/scenarios/*"
  to = "/solutions/"
  status = 301

# Catch-all : doit rester EN DERNIER.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
