<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Feuille de style tierce chargée sans bloquer le rendu : elle
         retardait le First Contentful Paint du temps de DNS + TLS + fetch vers
         fonts.googleapis.com, alors que le contenu est déjà prérendu et prêt à
         s'afficher. `media="print"` la sort du chemin critique, l'onload la
         réactive ; le <noscript> couvre le cas sans JS. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Yummeal - Cuisiner sain avec ce qu'il y a dans votre frigo</title>
    <meta
      name="description"
      content="Yummeal transforme votre frigo en recettes réalisables : cuisinez sainement, sans gaspiller. Téléchargement gratuit sur iOS et Android."
    />
    <link rel="canonical" href="https://yummeal.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yummeal" />
    <meta property="og:title" content="Yummeal - Cuisiner sain avec ce qu'il y a dans votre frigo" />
    <meta
      property="og:description"
      content="Transformez votre frigo en inspiration culinaire : recettes personnalisées, anti-gaspi, sans culpabilité."
    />
    <meta property="og:url" content="https://yummeal.app/" />
    <meta property="og:image" content="https://yummeal.app/images/yummeal_logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yummeal - Cuisiner sain avec ce qu'il y a dans votre frigo" />
    <meta
      name="twitter:description"
      content="Transformez votre frigo en inspiration culinaire : recettes personnalisées, anti-gaspi, sans culpabilité."
    />
    <!-- AppsFlyer Web SDK loader: local bundle + CDN fallbacks -->
    <script>
      (function loadAppsFlyerSdk() {
        const APP_VERSION = '20260307';
        const sources = [
          `/vendor/appsflyer/web_sdk.v1.0.min.js?v=${APP_VERSION}`,
          'https://cdn-go.appsflyer.com/js/v6.14.3/web_sdk.min.js',
          'https://cdn.appsflyer.com/web-sdk/latest/web_sdk.min.js'
        ];

        const loadSource = (index) => {
          if (index >= sources.length) {
            console.error('[AppsFlyer] Impossible de charger le SDK (toutes les sources ont échoué)');
            return;
          }

          const script = document.createElement('script');
          script.id = index === 0 ? 'appsflyer-web-sdk' : undefined;
          script.async = true;
          script.src = sources[index];

          script.onload = () => {
            window.dispatchEvent(new Event('appsflyer:sdk-ready'));
          };

          script.onerror = (event) => {
            console.error('[AppsFlyer] Échec du chargement du SDK', { source: sources[index], event });
            script.remove();
            loadSource(index + 1);
          };

          document.head.appendChild(script);
        };

        loadSource(0);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
